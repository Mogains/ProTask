name: Top3
options:
  bundleIdPrefix: com.anmolbhatt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Unsigned distribution: ad-hoc sign so macOS privacy prompts (Calendar, Notifications) work.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  Top3:
    type: application
    platform: macOS
    sources:
      - path: Top3
    preBuildScripts:
      # Fails the build when any appearance style, mode and accent combination drops below WCAG contrast.
      - name: Contrast check
        script: ./scripts/check-contrast.sh
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Top3/Shared/StyleTokens.swift
          - $(SRCROOT)/Top3/Logic/ContrastCheck.swift
          - $(SRCROOT)/scripts/contrast/main.swift
          - $(SRCROOT)/scripts/check-contrast.sh
        outputFiles:
          - $(DERIVED_FILE_DIR)/contrast-check.stamp
    settings:
      base:
        PRODUCT_NAME: "ProTask"
        PRODUCT_MODULE_NAME: Top3
        # Unchanged from the "Top 3" days so notification and calendar permissions carry over.
        PRODUCT_BUNDLE_IDENTIFIER: com.anmolbhatt.top3
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: ProTaskWidget
        embed: true
        codeSign: true
    info:
      path: Top3/Info.plist
      properties:
        CFBundleDisplayName: ProTask
        CFBundleName: ProTask
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSCalendarsFullAccessUsageDescription: ProTask adds tasks with due dates and your daily Top 3 to a "ProTask" calendar, and shows today's events so you can see your free time.
        NSCalendarsUsageDescription: ProTask adds tasks with due dates and your daily Top 3 to a "ProTask" calendar, and shows today's events so you can see your free time.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.anmolbhatt.top3.task
            UTTypeDescription: ProTask Task
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
  ProTaskWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Top3/Shared
      - path: Top3/Resources/Fonts
        buildPhase: resources
      - path: Top3/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: ProTaskWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.anmolbhatt.top3.widget
        CODE_SIGN_ENTITLEMENTS: Widget/ProTaskWidget.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: ProTask
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ATSApplicationFontsPath: .
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  Top3Tests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Top3Tests
      - path: Top3/Logic
      - path: Top3/Shared/StyleTokens.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anmolbhatt.top3.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Top3:
    build:
      targets:
        Top3: all
        Top3Tests: [test]
        ProTaskWidget: all
    test:
      targets: [Top3Tests]
