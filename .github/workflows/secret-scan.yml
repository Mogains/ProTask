name: Secret scan

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly added gitleaks rules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just the latest commit
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " gitleaks_${VERSION}_linux_x64.tar.gz$" checksums.txt | sed 's/gitleaks.tgz//' | awk '{print $1"  gitleaks.tgz"}' | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history
        run: ./gitleaks git . --redact --no-banner --verbose
